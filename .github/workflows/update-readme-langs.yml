name: Update README Languages

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update language section
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const { data: langs } = await github.rest.repos.listLanguages({ owner, repo });
            const entries = Object.entries(langs);
            if (entries.length === 0) {
              core.info("No language data found.");
              return;
            }

            const total = entries.reduce((sum, [, bytes]) => sum + bytes, 0);
            const top = entries
              .map(([name, bytes]) => ({ name, bytes, pct: (bytes / total) * 100 }))
              .sort((a, b) => b.bytes - a.bytes)
              .slice(0, 8);

            const bar = (pct) => {
              const len = 20;
              const filled = Math.round((pct / 100) * len);
              return "█".repeat(filled) + "░".repeat(len - filled);
            };

            const lines = top.map(l => `- ${l.name.padEnd(12)} ${bar(l.pct)} ${l.pct.toFixed(1)}%`);

            const fs = require("fs");
            const path = "README.md";
            let readme = fs.readFileSync(path, "utf8");

            const start = "<!--LANGS_START-->";
            const end = "<!--LANGS_END-->";

            if (!readme.includes(start) || !readme.includes(end)) {
              core.setFailed("README.md に <!--LANGS_START--> と <!--LANGS_END--> が必要です。");
              return;
            }

            const newSection = `${start}\n${lines.join("\n")}\n${end}`;
            readme = readme.replace(new RegExp(`${start}[\\s\\S]*?${end}`), newSection);

            fs.writeFileSync(path, readme, "utf8");
            core.info("README language section updated.");

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update language stats in README"
          git push