name: Update README Languages

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Update language section
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          script: |
            const fs = require("fs");
            const owner = context.repo.owner;

            // 1. プライベート含むすべてのリポジトリを一覧取得
            const repos = await github.paginate(github.rest.repos.listForAuthenticatedUser, {
              visibility: "all",
              affiliation: "owner",
              per_page: 100
            });

            // 2. 各リポジトリの言語データを合算
            const langs = {};
            for (const repo of repos) {
              if (repo.fork || repo.name === owner || repo.size === 0) continue;

              try {
                const { data } = await github.rest.repos.listLanguages({
                  owner,
                  repo: repo.name,
                });
                
                core.info(`Repository [${repo.name}] (${repo.private ? 'Private' : 'Public'}): ${JSON.stringify(data)}`);
                
                for (const [lang, bytes] of Object.entries(data)) {
                  langs[lang] = (langs[lang] || 0) + bytes;
                }
              } catch (e) {
                core.warning(`Failed to get languages for ${repo.name}: ${e.message}`);
              }
            }

            const entries = Object.entries(langs);
            if (entries.length === 0) {
              core.setFailed("No language data found across your repositories.");
              return;
            }

            core.info(`Total aggregated languages (bytes): ${JSON.stringify(langs)}`);

            const total = entries.reduce((sum, [, bytes]) => sum + bytes, 0);
            const top = entries
              .map(([name, bytes]) => ({ name, bytes, pct: (bytes / total) * 100 }))
              .sort((a, b) => b.bytes - a.bytes)
              .slice(0, 8);

            const bar = (pct) => {
              const len = 20;
              const filled = Math.round((pct / 100) * len);
              return "█".repeat(filled) + "░".repeat(len - filled);
            };

            const lines = top.map(
              (l) => `- ${l.name.padEnd(12)} ${bar(l.pct)} ${l.pct.toFixed(1)}%`
            );

            const path = "README.md";
            let readme = fs.readFileSync(path, "utf8");

            const start = "<!--LANGS_START-->";
            const end = "<!--LANGS_END-->";

            const startIdx = readme.indexOf(start);
            const endIdx = readme.indexOf(end);

            if (startIdx === -1 || endIdx === -1 || endIdx < startIdx) {
              core.setFailed("README.md markers not found or invalid.");
              return;
            }

            const before = readme.slice(0, startIdx + start.length);
            const after = readme.slice(endIdx);
            const replacement = `\n${lines.join("\n")}\n`;
            const updated = before + replacement + after;

            if (updated === readme) {
              core.warning("Generated content is identical. No update needed.");
            } else {
              fs.writeFileSync(path, updated, "utf8");
              core.info("README language section updated.");
            }

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update language stats in README"
          git push
